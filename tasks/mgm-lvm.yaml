---
- name: LVM - Conduct resize test of physical volumes
  ansible.builtin.shell: "pvresize {{ lvm_device.stdout }}"
  changed_when: true

- name: Detect filesystem type on LVs
  ansible.builtin.shell: "blkid -o value -s TYPE /dev/{{ lvm_vg }}/{{ item }}"
  loop:
    - "{{ lv_root_name }}"
    - "{{ lv_home_name }}"
    - "{{ lv_var_name }}"
  register: lv_fs_types
  changed_when: false

- name: Set filesystem type facts
  ansible.builtin.set_fact:
    fs_type_map: "{{ fs_type_map | default({}) | combine({item.item: item.stdout}) }}"
  loop: "{{ lv_fs_types.results }}"
  loop_control:
    label: "{{ item.item }}: {{ item.stdout }}"

# LVs only ever grow (#6). `shrink: false` turns a target below the current
# size into a no-op (ok, not changed) instead of an lvreduce -- which fails on
# xfs and, with older lvm2 (< 2.03.17) that does not check the filesystem, can
# cut a mounted ext4. `force` is not set: lvol only needs it for lvreduce and
# lvremove, lvextend never uses it.
# The filesystem grow always runs, so a rerun also finishes a grow that failed
# after an earlier lvextend. Growing to the current size is a no-op for both
# tools; `changed` comes from their output: xfs_growfs prints "data blocks
# changed" (stdout) only when it grew, resize2fs prints "Nothing to do!"
# (stderr) when the fs already fills the LV.
- name: Resize lv {{ lv_root_name }} in {{ lvm_vg }}
  community.general.lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lv_root_name }}"
    size: "{{ lvm_root_sizing }}PVS"
    resizefs: false
    shrink: false
  register: manage_filesystem_lv_root_resize

- name: Resize filesystem on {{ lv_root_name }}
  ansible.builtin.command: >-
    {{ 'xfs_growfs' if fs_type_map[lv_root_name] == 'xfs' else 'resize2fs' }}
    /dev/{{ lvm_vg }}/{{ lv_root_name }}
  register: manage_filesystem_fs_root_grow
  changed_when: >-
    ('data blocks changed' in manage_filesystem_fs_root_grow.stdout)
    if fs_type_map[lv_root_name] == 'xfs' else
    ('Nothing to do' not in (manage_filesystem_fs_root_grow.stdout ~ manage_filesystem_fs_root_grow.stderr))

- name: Resize lv {{ lv_home_name }} in {{ lvm_vg }}
  community.general.lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lv_home_name }}"
    size: "{{ lvm_home_sizing }}PVS"
    resizefs: false
    shrink: false
  register: manage_filesystem_lv_home_resize

- name: Resize filesystem on {{ lv_home_name }}
  ansible.builtin.command: >-
    {{ 'xfs_growfs' if fs_type_map[lv_home_name] == 'xfs' else 'resize2fs' }}
    /dev/{{ lvm_vg }}/{{ lv_home_name }}
  register: manage_filesystem_fs_home_grow
  changed_when: >-
    ('data blocks changed' in manage_filesystem_fs_home_grow.stdout)
    if fs_type_map[lv_home_name] == 'xfs' else
    ('Nothing to do' not in (manage_filesystem_fs_home_grow.stdout ~ manage_filesystem_fs_home_grow.stderr))

- name: Resize lv {{ lv_var_name }} in {{ lvm_vg }}
  community.general.lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lv_var_name }}"
    size: +100%FREE
    resizefs: false
    shrink: false
  register: manage_filesystem_lv_var_resize

- name: Resize filesystem on {{ lv_var_name }}
  ansible.builtin.command: >-
    {{ 'xfs_growfs' if fs_type_map[lv_var_name] == 'xfs' else 'resize2fs' }}
    /dev/{{ lvm_vg }}/{{ lv_var_name }}
  register: manage_filesystem_fs_var_grow
  changed_when: >-
    ('data blocks changed' in manage_filesystem_fs_var_grow.stdout)
    if fs_type_map[lv_var_name] == 'xfs' else
    ('Nothing to do' not in (manage_filesystem_fs_var_grow.stdout ~ manage_filesystem_fs_var_grow.stderr))
