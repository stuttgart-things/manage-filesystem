---
name: Ansible lint
on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  yaml-lint:
    name: Lint yaml files
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-yaml-lint.yaml@15bb803fd72658fda50120f8a566d5594061e6ee # v1.2.0
    with:
      runs-on: ghr-manage-filesystem-in-cluster
      environment-name: k8s
      continue-error: true
      yamllint-version: 1
      lintprofile-path: .yamllint
      artifact-name: yaml-lint

  ansible-lint:
    name: Lint ansible code
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ansible-lint.yaml@15bb803fd72658fda50120f8a566d5594061e6ee # v1.2.0
    with:
      runs-on: ghr-manage-filesystem-in-cluster
      environment-name: k8s
      continue-error: false
      ansible-image: ghcr.io/stuttgart-things/sthings-ansible:13.5.0-test
      playbook: tests/test-lvm-never-shrink.yml
      # Lint is clean: findings fail the job (github-workflow-templates#228).
      fail-on-findings: true
    needs: yaml-lint
